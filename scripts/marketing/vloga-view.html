<!doctype html>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; background: #fff; }
  canvas { display: block; }
</style>
<canvas id="page"></canvas>
<script type="module">
  // Renders ONE page of a real PDF and then writes on it.
  //
  // The Slovenian application for a grid connection consent is a genuine
  // AcroForm published by the distribution operator. Belin's story is that the
  // EPC never types any of it, so the honest picture is that exact form with
  // this project's values sitting on its real blank lines, not a lookalike.
  //
  // pdfjs gives two things that make that possible without a PDF writer:
  // getFieldObjects() returns every field's rectangle in PDF user space, and
  // viewport.convertToViewportPoint() maps that space onto the canvas. So the
  // values land where the operator put the lines, at any scale.
  import * as pdfjs from "/pdfjs/pdf.mjs";
  pdfjs.GlobalWorkerOptions.workerSrc = "/pdfjs/pdf.worker.mjs";

  const INK = "#18386b"; // a blue pen, which is what a filled form looks like

  window.fillForm = async (bytes, pageNumber, scale, values, circles, ticks) => {
    const doc = await pdfjs.getDocument({ data: new Uint8Array(bytes) }).promise;
    const page = await doc.getPage(pageNumber);
    const viewport = page.getViewport({ scale });
    const canvas = document.getElementById("page");
    canvas.width = Math.ceil(viewport.width);
    canvas.height = Math.ceil(viewport.height);
    const ctx = canvas.getContext("2d");
    await page.render({ canvasContext: ctx, viewport }).promise;

    /**
     * A field rect is [x1,y1,x2,y2] in PDF space, y up. Canvas wants y down.
     *
     * `lift` raises one field by n points. Three fields on page 2 need it: the
     * operator placed those widgets a full row BELOW their own printed labels
     * (the "Naziv" label sits at y=766, its box at y=746..764), so a faithful
     * fill reads as one line out. Everything else lifts by 0.
     */
    const toBox = (rect, lift = 0) => {
      const a = viewport.convertToViewportPoint(rect[0], rect[1] + lift);
      const b = viewport.convertToViewportPoint(rect[2], rect[3] + lift);
      return {
        x: Math.min(a[0], b[0]),
        y: Math.min(a[1], b[1]),
        w: Math.abs(b[0] - a[0]),
        h: Math.abs(b[1] - a[1]),
      };
    };

    // ---- text fields -------------------------------------------------------
    const fields = await doc.getFieldObjects();
    const missing = [];
    ctx.fillStyle = INK;
    ctx.textBaseline = "alphabetic";

    for (const [name, raw] of Object.entries(values)) {
      const value = typeof raw === "string" ? raw : raw.v;
      const entry = fields?.[name]?.find((f) => f.page === pageNumber - 1);
      if (!entry || !entry.rect) { missing.push(name); continue; }
      const box = toBox(entry.rect, typeof raw === "string" ? 0 : (raw.lift ?? 0));
      // Type size follows the field, so a tight one-line box and a tall note
      // box both read as something typed into that box rather than over it.
      let size = Math.max(Math.min(box.h * 0.62, 13 * scale), 8.5 * scale);
      ctx.font = `500 ${size}px Inter, "Segoe UI", system-ui, sans-serif`;
      // Long values shrink to fit rather than running off the printed line.
      while (ctx.measureText(value).width > box.w - 6 * scale && size > 6 * scale) {
        size -= 0.5;
        ctx.font = `500 ${size}px Inter, "Segoe UI", system-ui, sans-serif`;
      }
      ctx.fillText(value, box.x + 3 * scale, box.y + box.h * 0.5 + size * 0.36);
    }

    // ---- the "obkroži" (circle one) and checkbox answers --------------------
    // These are not fields: the operator prints the options as body text and
    // expects a pen. So the words are located in the text layer and rung.
    const content = await page.getTextContent();
    const items = content.items.filter((i) => i.str && i.str.trim());

    /**
     * Box of a literal substring inside the page's text items.
     *
     * `exact` matches a whole item instead of a substring, which is the only
     * reliable way to hit the standalone "DA" and "NE" options: as a substring
     * "NE" also lives inside PROIZVODNE, and "DA" inside PODATKI.
     */
    const locate = (needle, nth = 0, exact = false) => {
      let seen = 0;
      for (const item of items) {
        const at = exact ? (item.str.trim() === needle ? item.str.indexOf(needle) : -1) : item.str.indexOf(needle);
        if (at < 0) continue;
        if (seen++ < nth) continue;
        // Item transform is [a,b,c,d,e,f]; e,f is the baseline origin.
        const [, , , , e, f] = item.transform;
        const perChar = item.width / item.str.length;
        const p = viewport.convertToViewportPoint(e + at * perChar, f);
        return {
          x: p[0],
          y: p[1],
          w: perChar * needle.length * scale,
          h: item.height * scale,
        };
      }
      return null;
    };

    ctx.strokeStyle = INK;
    ctx.lineWidth = 1.6 * scale;
    ctx.lineCap = "round";

    for (const c of circles) {
      const box = locate(c.text, c.nth ?? 0, c.exact);
      if (!box) { missing.push(`circle:${c.text}`); continue; }
      // perChar is an average, so a substring deep inside a long line lands a
      // character or two early. `dx` is the per-target correction, in points.
      ctx.beginPath();
      ctx.ellipse(
        box.x + box.w / 2 + (c.dx ?? 0) * scale,
        box.y - box.h * 0.3,
        box.w * 0.56 + 4 * scale,
        box.h * 0.92,
        0, 0, Math.PI * 2,
      );
      ctx.stroke();
    }

    // A tick goes just left of the option's text, where the printed box sits.
    for (const t of ticks) {
      const box = locate(t.text, t.nth ?? 0, t.exact);
      if (!box) { missing.push(`tick:${t.text}`); continue; }
      const s = box.h * 0.8;
      const x = box.x - (t.dx ?? 9) * scale;
      const y = box.y - box.h * 0.35;
      ctx.beginPath();
      ctx.moveTo(x - s * 0.45, y);
      ctx.lineTo(x - s * 0.1, y + s * 0.42);
      ctx.lineTo(x + s * 0.55, y - s * 0.55);
      ctx.stroke();
    }

    // Kept so signPage() can write on the page that was just rendered.
    window.__sheet = { ctx, scale, locate };

    return { width: canvas.width, height: canvas.height, pages: doc.numPages, missing };
  };

  /**
   * Signs the sheet by hand, on the operator's own signature line.
   *
   * The form itself says what to do when you have no qualified certificate:
   * "lahko podpis narišete z miško". Belin's answer is the same gesture with a
   * finger on a phone, so the mark here is a drawn stroke rather than a font.
   * The path is the one the page's own demo signature draws, at the same 2.2px
   * stroke the product's SignaturePad uses, scaled to the sheet.
   */
  window.signPage = () => {
    const { ctx, scale, locate } = window.__sheet;
    const line = locate("Kraj in datum");
    if (!line) return false;

    ctx.fillStyle = INK;
    ctx.font = `500 ${11 * scale}px Inter, "Segoe UI", system-ui, sans-serif`;
    ctx.fillText("Kranj, 16. 09. 2026", line.x + 78 * scale, line.y - 2 * scale);

    // Signature sits above the printed rule on the right.
    const ox = line.x + 300 * scale;
    const oy = line.y + 24 * scale;
    const u = scale * 0.55;
    ctx.strokeStyle = INK;
    ctx.lineWidth = 2.2 * scale * 0.8;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.beginPath();
    ctx.moveTo(ox, oy);
    ctx.bezierCurveTo(ox + 14 * u, oy - 26 * u, ox + 26 * u, oy - 22 * u, ox + 30 * u, oy - 2 * u);
    ctx.bezierCurveTo(ox + 34 * u, oy + 16 * u, ox + 44 * u, oy + 10 * u, ox + 52 * u, oy - 14 * u);
    ctx.bezierCurveTo(ox + 60 * u, oy - 36 * u, ox + 74 * u, oy - 20 * u, ox + 80 * u, oy - 4 * u);
    ctx.bezierCurveTo(ox + 88 * u, oy + 14 * u, ox + 104 * u, oy + 6 * u, ox + 126 * u, oy - 18 * u);
    ctx.stroke();
    return true;
  };
</script>
